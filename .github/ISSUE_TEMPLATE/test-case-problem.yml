name: Problem with an existing test case
description: Ambiguous rubric, wrong expected behavior, shortcut, or a bug in a test file.
labels: ["test-case", "bug"]
body:
  - type: input
    id: id
    attributes:
      label: Test ID
      placeholder: CONSEQUENCE-001
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong?
      description: If possible, include a response that the rubric scores incorrectly.
    validations:
      required: true
